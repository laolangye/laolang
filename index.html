<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老狼音频工作室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background: #f8f9fa;
            color: #333;
            padding-top: 20px; /* 修复顶部间距 */
        }
        .header {
            text-align: center;
            padding: 40px 20px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-bottom: 20px;
            border-radius: 0 0 20px 20px;
        }
        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .header p {
            font-size: 15px;
            opacity: 0.9;
            margin-bottom: 20px;
        }
        .search-box {
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 30px;
            display: inline-block;
            font-size: 14px;
            backdrop-filter: blur(5px);
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 15px 40px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.1);
        }
        .cover {
            height: 140px;
            position: relative;
            overflow: hidden;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 42px;
        }
        .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .cover-icon {
            position: relative;
            z-index: 1;
            text-align: center;
        }
        .cover-text {
            position: absolute;
            bottom: 12px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            z-index: 1;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .card-info {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .card-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #222;
        }
        .card-desc {
            font-size: 13px;
            color: #777;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .tag {
            display: inline-block;
            background: #f0f4ff;
            color: #667eea;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            align-self: flex-start;
            margin-bottom: 12px;
        }
        .player-section {
            margin-top: auto;
            width: 100%;
        }
        audio {
            width: 100%;
            outline: none;
            border-radius: 30px;
            height: 36px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>我的音频网站</h1>
        <p>资源分享与音频播放</p >
        <div class="search-box">🔍 输入关键字开始搜索</div>
    </div>

    <div class="container">
        <div class="grid">
            <!-- 卡片 1：精选单曲 -->
            <div class="card">
                <div class="cover" style="background:linear-gradient(135deg,#667eea,#764ba2);">
                    <div class="cover-icon">▶️</div>
                    <div class="cover-text">精选单曲</div>
                </div>
                <div class="card-info">
                    <div class="card-title">精选单曲</div>
                    <div class="card-desc">网站搭建成功！来听首歌吧</div>
                    <span class="tag">音频播放</span>
                    <div class="player-section">
                        <audio controls autoplay loop>
                            <!-- ⚠️ 这里替换成你真实的音频文件名 -->
                            <source src="music..mp3" type="audio/mpeg">
                            您的浏览器不支持音频播放。
                        </audio>
                    </div>
                </div>
            </div>
