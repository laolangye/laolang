<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老狼音频工作室</title>
    <style>
        /* 基础与渐变背景 */
        body {
            margin: 0;
            padding: 0;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        /* 顶部区域 */
        .header {
            padding: 40px 20px 20px;
            text-align: center;
            color: white;
        }
        .header h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 1px;
        }
        .header p {
            margin: 10px 0 20px;
            font-size: 14px;
            opacity: 0.9;
        }
        /* 搜索框 */
        .search-box {
            background: rgba(255,255,255,0.9);
            border-radius: 30px;
            padding: 10px 20px;
            width: 80%;
            max-width: 400px;
            margin: 0 auto;
            text-align: left;
            color: #999;
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        /* 主体卡片容器 */
        .container {
            padding: 20px;
            max-width: 900px;
            margin: 0 auto 40px;
        }
        /* 网格布局（手机单列，大屏双列） */
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media (min-width: 600px) {
            .grid { grid-template-columns: 1fr 1fr; }
        }
        /* 资源卡片 */
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        /* 封面占位图 */
        .cover {
            width: 80px;
            height: 80px;
            background: #e0eaff;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-right: 15px;
            flex-shrink: 0;
        }
        .card-info {
            flex: 1;
        }
        .card-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .card-desc {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }
        .tag {
            display: inline-block;
            background: #f0f4ff;
            color: #667eea;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
        }
        /* 播放器区域（保留你原有的核心） */
        .player-section {
            margin-top: 10px;
            width: 100%;
        }
        audio {
            width: 100%;
            outline: none;
            border-radius: 30px;
        }
    </style>
</head>
