<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老狼音频工作室</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f5f9;
            color: #333;
        }
        /* 顶部 */
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 40px 20px 30px;
            text-align: center;
            color: white;
        }
        .header h1 { font-size: 28px; margin-bottom: 6px; }
        .header p { font-size: 14px; opacity: 0.9; margin-bottom: 20px; }
        .search-box {
            background: rgba(255,255,255,0.25);
            padding: 12px 22px;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            width: 90%;
            max-width: 400px;
            backdrop-filter: blur(6px);
        }
        .search-box span { margin-right: 10px; font-size: 16px; }
        .search-box input {
            border: none;
            background: transparent;
            outline: none;
            color: white;
            font-size: 15px;
            width: 100%;
        }
        .search-box input::placeholder { color: rgba(255,255,255,0.7); }

        /* 主体 */
        .container { max-width: 1000px; margin: 0 auto; padding: 30px 20px; }
        .section-title { font-size: 18px; margin-bottom: 16px; color: #444; font-weight: bold; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 22px;
        }
        .card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 12px 26px rgba(0,0,0,0.12); }

        .cover {
            height: 130px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .cover-icon { font-size: 42px; margin-bottom: 6px; }
        .cover-text { font-size: 15px; font-weight: bold; }

        .card-info { padding: 16px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 16px; font-weight: bold; margin-bottom: 6px; }
        .card-desc { font-size: 13px; color: #777; margin-bottom: 12px; line-height: 1.4; }
        .tag-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .tag { padding: 3px 10px; border-radius: 12px; font-size: 12px; }
        .buy-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 5px 14px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .buy-btn:hover { opacity: 0.85; }

        .player-section { margin-top: auto; width: 100%; }
        audio { width: 100%; outline: none; border-radius: 30px; height: 34px; }

        /* 弹窗 */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white;
            border-radius: 20px;
            padding: 28px 24px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            position: relative;
            animation: pop 0.25s ease;
        }
        @keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-close {
            position: absolute; top: 14px; right: 16px;
            font-size: 22px; cursor: pointer; color: #999;
            background: none; border: none;
        }
        .modal h3 { font-size: 20px; margin-bottom: 8px; }
        .modal .price { font-size: 26px; color: #e63946; font-weight: bold; margin: 10px 0; }
        .modal .qrcode {
            width: 180px; height: 180px;
            margin: 12px auto;
            background: #f0f0f0;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: #999; font-size: 14px;
        }
        .modal .qrcode img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
        .modal p.tip { font-size: 13px; color: #777; margin-top: 10px; line-height: 1.5; }
